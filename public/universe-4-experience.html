<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Business Universe — NIFINANCE</title>
<style>
:root{color-scheme:dark;--ink:#eaf4e8;--muted:#91a58e;--glass:rgba(7,13,9,.84)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030704;color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,rgba(0,4,1,.2) 65%,rgba(0,3,1,.86) 100%)}
.top{position:fixed;z-index:3;top:22px;left:26px;pointer-events:none}.top strong{font-size:11px;letter-spacing:.32em}.top span{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:5px}.status{position:fixed;z-index:3;right:26px;top:25px;color:#8ba18a;font-size:10px;letter-spacing:.2em}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b7f77d;box-shadow:0 0 12px #b7f77d;margin-right:8px}.tip{position:fixed;z-index:2;bottom:88px;left:0;right:0;text-align:center;color:#7d927a;font-size:10px;letter-spacing:.16em;pointer-events:none;transition:opacity .8s}
.dock{position:fixed;z-index:4;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100vw - 24px);padding:7px;border:1px solid rgba(177,224,151,.13);border-radius:18px;background:rgba(4,10,6,.78);backdrop-filter:blur(18px);overflow-x:auto;scrollbar-width:none}.dock::-webkit-scrollbar{display:none}button{font:inherit;color:inherit;cursor:pointer}.dock button{border:1px solid transparent;border-radius:11px;background:transparent;padding:8px 11px;white-space:nowrap;font-size:11px;color:#a9b9a5;transition:background .35s,border-color .35s,color .35s}.dock button:hover,.dock button.active{color:#f0ffe9;background:rgba(174,239,125,.09);border-color:rgba(174,239,125,.24)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;box-shadow:0 0 9px currentColor}
#panel{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:visible}.panel{position:fixed;pointer-events:auto;z-index:5;left:calc(100vw - 384px);top:76px;width:min(360px,calc(100vw - 32px));height:min(620px,calc(100vh - 180px));min-width:260px;min-height:220px;padding:22px;border:1px solid rgba(176,226,149,.17);border-radius:20px;background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 20px 80px rgba(0,0,0,.35);overflow:auto;opacity:0;visibility:hidden;transform:translate3d(18px,0,0);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility .25s;scrollbar-width:none;resize:both}.panel.open{opacity:1;visibility:visible;transform:none}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:grab;user-select:none;touch-action:none}.panel-head:active{cursor:grabbing}.eyebrow{font-size:9px;letter-spacing:.24em;color:var(--muted)}.actions{display:flex;gap:6px}.actions button{font-size:10px;color:#a8bba1;border:1px solid rgba(176,226,149,.2);border-radius:8px;background:rgba(176,226,149,.05);padding:6px 9px;cursor:pointer}.panel-close{cursor:pointer}.panel h1{font-size:27px;letter-spacing:-.04em;margin:16px 0 5px}.desc{color:#96a994;font-size:12px;margin:0 0 18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid rgba(176,226,149,.1);border-radius:12px;background:rgba(176,226,149,.045);padding:11px}.metric small{display:block;color:#93a58f;font-size:10px}.metric b{display:block;font-size:18px;margin:3px 0}.delta{font-size:10px;color:#c9ff78}.delta.down{color:#ffad8b}.section{font-size:9px;letter-spacing:.2em;color:#82977e;margin:20px 0 9px}.links{display:grid;gap:6px}.link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:1px solid rgba(176,226,149,.12);border-radius:10px;background:rgba(176,226,149,.035);font-size:11px}.link small{margin-left:auto;color:#82977e;font-size:9px}.link:hover{background:rgba(176,226,149,.1)}
@media(max-width:720px){.top{top:15px;left:16px}.status{top:18px;right:16px}.panel{left:10px!important;top:74px!important;bottom:auto!important;width:calc(100vw - 20px);height:min(62vh,520px);max-height:calc(100vh - 150px);min-width:0;min-height:220px;padding:17px;resize:both;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}.panel-head{position:sticky;top:-17px;z-index:2;padding-top:17px;padding-bottom:10px;margin-bottom:0;background:linear-gradient(var(--glass) 72%,transparent);backdrop-filter:blur(12px)}.dock{left:10px;right:10px;transform:none;max-width:none;justify-content:flex-start}.tip{display:none}}@media(prefers-reduced-motion:reduce){.panel,.dock button{transition:none}}
</style></head><body><canvas id="universe"></canvas><div class="shade"></div><div class="top"><strong>BUSINESS UNIVERSE</strong><span>NIFINANCE · INTERACTIVE SYSTEM</span></div><div class="status"><i></i>LIVE MODEL</div><div class="tip" id="tip">DRAG TO ROTATE · SCROLL TO ZOOM · SELECT A NODE</div><div id="panel"></div><nav class="dock" id="dock"></nav>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('universe'),ctx=canvas.getContext('2d'),panel=document.getElementById('panel'),dock=document.getElementById('dock'),tip=document.getElementById('tip'),TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,V=(x,y,z)=>({x,y,z}),add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),mul=(a,s)=>V(a.x*s,a.y*s,a.z*s),norm=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return mul(a,1/l)};
const rows=[
['Marketing','#71dfff',8,8,'Demand, brand and lead generation',[['Leads','12 480','+14%'],['CPL','₽312','−6%'],['ROMI','238%','+21%'],['Reach','3.4m','+9%']]],
['Sales','#b9a0ff',42,3,'Pipeline, deals and revenue',[['Revenue','₽48.2m','+12%'],['Conversion','18.4%','+2.1%'],['Average order','₽86k','+5%'],['Sales cycle','21 days','−3d']]],
['Customers','#f3e66d',80,13,'Customer base, retention and loyalty',[['Active customers','8 640','+7%'],['Retention','87%','+2%'],['LTV','₽412k','+11%'],['Churn','3.1%','−0.4%']]],
['Production','#ff8c70',128,-5,'Output, capacity and quality',[['Output','12 300','+6%'],['Capacity','84%','+3%'],['Defects','1.2%','−0.3%'],['OEE','76%','+4%']]],
['Procurement','#ffbf69',174,12,'Materials, suppliers and inventory',[['Volume','₽19.5m','+4%'],['Suppliers','38','+2'],['Inventory turnover','42 days','−5d'],['Discounts','6.8%','+0.9%']]],
['Logistics','#70d6b2',222,-10,'Delivery, routes and timelines',[['Shipments','3 920','+8%'],['On time','96.2%','+1.4%'],['Cost per order','₽214','−7%'],['Returns','1.9%','−0.2%']]],
['Finance','#e8f3df',285,30,'Cash, liquidity and budget',[['Cash flow','₽7.4m','+15%'],['Liquidity','1.8','+0.2'],['Receivables','₽9.1m','−8%'],['Loans','₽12m','−2%']]],
['Economics','#9dff8c',335,38,'Margins, unit economics and profitability',[['Margin','31.4%','+1.8%'],['EBITDA','₽11.6m','+14%'],['Unit cost','₽59k','−3%'],['ROI','27%','+4%']]],
['People','#b9a0ff',262,-42,'Team, hiring and performance',[['Employees','186','+9'],['Turnover','8.3%','−1.1%'],['Output / person','₽259k','+6%'],['eNPS','42','+5']]],
['Data & IT','#71dfff',30,-46,'Systems, analytics and automation',[['Uptime','99.95%','+0.02%'],['Automation','63%','+7%'],['Dashboards','48','+6'],['Incidents','2','−3']]]
];
const nodes=rows.map((r,i)=>{const lat=r[3]*Math.PI/180,lon=r[2]*Math.PI/180;return{id:i,name:r[0],color:r[1],desc:r[4],metrics:r[5],base:V(Math.cos(lat)*Math.sin(lon),Math.sin(lat),Math.cos(lat)*Math.cos(lon)),phase:i*1.71};});
const links=[[0,1,'lead flow'],[1,2,'customer value'],[2,0,'feedback'],[1,3,'orders'],[3,4,'materials'],[4,5,'supply'],[3,5,'delivery'],[5,2,'experience'],[1,6,'revenue'],[6,7,'planning'],[7,3,'unit cost'],[7,1,'pricing'],[8,3,'capacity'],[8,6,'payroll'],[9,0,'campaign data'],[9,1,'CRM'],[9,7,'analytics']];
let w=0,h=0,dpr=1,cx=0,cy=0,yaw=.35,pitch=.08,targetYaw=yaw,targetPitch=pitch,zoom=1.12,targetZoom=1.12,selected=null,hover=null,drag=null,last=performance.now(),time=0,stars=[],panelWindows=[],panelZ=20,panelDrag=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cx=w*.5;cy=h*.5;stars=Array.from({length:Math.round(w*h/720)},(_,i)=>({x:random(i+2)*w,y:random(i+19)*h,r:.32+random(i+43)*.62,a:.48+random(i+61)*.34,phase:random(i+73)*TAU,speed:.42+random(i+89)*.72,depth:.25+random(i+97)*.75,twinkle:.28+random(i+107)*.34,driftX:(random(i+127)-.5)*2.4,driftY:(random(i+139)-.5)*2.4}));}
function random(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function world(n){return mul(n.base,2.25*(1+Math.sin(time*.17+n.phase)*.002));}
function project(p){const cosYaw=Math.cos(yaw),sinYaw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cosYaw-p.z*sinYaw,z=p.x*sinYaw+p.z*cosYaw,y=p.y*cp-z*sp,zz=p.y*sp+z*cp,s=Math.min(w,h)*.53*zoom/4.2;return{x:cx+x*s,y:cy-y*s,z:zz,s};}
function bezier(a,b,c,t){const q=1-t;return add(add(mul(a,q*q),mul(c,2*q*t)),mul(b,t*t));}
function curvePoint(a,b,c,t){return project(bezier(a,b,c,t));}
function control(a,b,i){return add(mul(add(a,b),.5),mul(norm(add(a,b)),.28+Math.sin(i*4.3)*.06));}
function drawBackground(){ctx.fillStyle='#000000';ctx.fillRect(0,0,w,h);const parallax=1+(zoom-1.12)*.075,driftX=Math.sin(time*.055)*3,driftY=Math.cos(time*.043)*2;for(let i=0;i<stars.length;i++){const s=stars[i],wave=.5+.5*Math.sin(time*s.speed+s.phase),pulse=1-s.twinkle+ s.twinkle*wave,x=cx+(s.x-cx)*parallax+driftX*s.depth+Math.sin(time*.16+s.phase)*s.driftX,y=cy+(s.y-cy)*parallax+driftY*s.depth+Math.cos(time*.13+s.phase)*s.driftY;ctx.globalAlpha=s.a*pulse;ctx.fillStyle=i%29===0?'#dff6ff':i%23===0?'#d8caff':'#e6ffd8';ctx.beginPath();ctx.arc(x,y,s.r,0,TAU);ctx.fill();if(i%41===0){ctx.globalAlpha*=.25;ctx.shadowBlur=5;ctx.shadowColor='#d9f6ff';ctx.beginPath();ctx.arc(x,y,s.r*1.7,0,TAU);ctx.fill();ctx.shadowBlur=0;}}ctx.globalAlpha=1;}
function drawSphere(){ctx.save();ctx.strokeStyle='rgba(147,184,135,.075)';ctx.lineWidth=.7;for(let j=1;j<6;j++){const lat=-Math.PI/2+j*Math.PI/6;ctx.beginPath();for(let i=0;i<=100;i++){const lon=i/100*TAU,p=V(2.25*Math.cos(lat)*Math.sin(lon),2.25*Math.sin(lat),2.25*Math.cos(lat)*Math.cos(lon)),q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}ctx.stroke();}for(let j=0;j<12;j++){const lon=j*TAU/12;ctx.beginPath();for(let i=0;i<=80;i++){const lat=-Math.PI/2+i/80*Math.PI,p=V(2.25*Math.cos(lat)*Math.sin(lon),2.25*Math.sin(lat),2.25*Math.cos(lat)*Math.cos(lon)),q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}ctx.stroke();}ctx.restore();}
function drawLinks(){links.forEach((ln,i)=>{const a=world(nodes[ln[0]]),b=world(nodes[ln[1]]),c=control(a,b,i),active=selected===ln[0]||selected===ln[1]||hover===ln[0]||hover===ln[1];ctx.beginPath();for(let j=0;j<=48;j++){const p=curvePoint(a,b,c,j/48);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.strokeStyle=active?'rgba(190,245,150,.55)':'rgba(146,184,139,.17)';ctx.lineWidth=active?1.35:.75;ctx.stroke();
for(let k=0;k<2;k++){const speed=.085+(i%4)*.012,phase=i*.173+k*.5,u=(time*speed+phase)%1,p=curvePoint(a,b,c,u),pulse=.72+.28*Math.sin(time*2.2+i+k),r=(active?2.1:1.35)*pulse;const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);glow.addColorStop(0,active?'rgba(213,255,173,.95)':'rgba(172,230,148,.7)');glow.addColorStop(1,'rgba(172,230,148,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,r*4,0,TAU);ctx.fill();ctx.fillStyle=active?'#e3ffd1':'#a8d995';ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();}
if(active){const p=curvePoint(a,b,c,.5);ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(214,235,205,.75)';ctx.fillText(ln[2],p.x,p.y-7);}});}
function drawNode(n){const p=project(world(n)),front=p.z>0,active=selected===n.id,isHover=hover===n.id,r=clamp(4.2*p.s/100,3.4,8.5)*(active?1.28:1),glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*5);glow.addColorStop(0,n.color+'aa');glow.addColorStop(1,n.color+'00');ctx.globalAlpha=front?1:.25;ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,r*5,0,TAU);ctx.fill();ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();ctx.strokeStyle=n.color+'99';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,r*(active?2.1:isHover?1.9:1.5),0,TAU);ctx.stroke();ctx.globalAlpha=front?1:.38;ctx.font='600 '+clamp(10*p.s/100,10,13)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#e8f2e4';ctx.shadowColor=n.color;ctx.shadowBlur=active?14:7;ctx.fillText(n.name,p.x,p.y-r-9);ctx.shadowBlur=0;ctx.globalAlpha=1;return{x:p.x,y:p.y,z:p.z,r:Math.max(22,n.name.length*3.5+15)};}
function frame(){const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;time+=dt;yaw+=(targetYaw-yaw)*(1-Math.exp(-dt*4.2));pitch+=(targetPitch-pitch)*(1-Math.exp(-dt*4.2));zoom+=(targetZoom-zoom)*(1-Math.exp(-dt*3.5));if(!drag&&!selected)targetYaw+=dt*.035;drawBackground();drawSphere();drawLinks();const hits=[];nodes.map(n=>({n,p:drawNode(n)})).sort((a,b)=>b.p.z-a.p.z).forEach(o=>hits.push({id:o.n.id,...o.p}));canvas._hits=hits;requestAnimationFrame(frame);}
function panelFor(id){return panelWindows.find(p=>p.id===id);}
function focusPanel(id){const p=panelFor(id);if(!p)return;p.z=++panelZ;const el=document.querySelector('.panel[data-panel="'+id+'"]');if(el)el.style.zIndex=p.z;}
function openPanel(id){let p=panelFor(id);if(!p){const count=panelWindows.length;p={id,z:++panelZ,x:Math.max(14,window.innerWidth-384-count*28),y:76+count*28,w:360,h:Math.min(620,Math.max(260,window.innerHeight-180))};panelWindows.push(p);}focusPanel(id);selected=id;renderPanels();}
function closePanel(id){panelWindows=panelWindows.filter(p=>p.id!==id);if(selected===id)selected=panelWindows.length?panelWindows[panelWindows.length-1].id:null;renderPanels();}
function renderPanels(){panel.innerHTML='';panelWindows.forEach(p=>{const n=nodes[p.id],related=links.filter(l=>l[0]===p.id||l[1]===p.id).map(l=>{const other=nodes[l[0]===p.id?l[1]:l[0]];return'<button class="link" data-select="'+other.id+'"><i class="dot" style="color:'+other.color+';background:'+other.color+'"></i>'+other.name+'<small>'+l[2]+'</small></button>';}).join('');const el=document.createElement('section');el.className='panel open';el.dataset.panel=p.id;el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.w+'px';el.style.height=p.h+'px';el.style.zIndex=p.z;el.innerHTML='<div class="panel-head" data-drag><span class="eyebrow">BUSINESS AREA / '+String(n.id+1).padStart(2,'0')+'</span><div class="actions"><button data-home>OVERVIEW</button><button data-close class="panel-close">✕</button></div></div><h1>'+n.name+'</h1><p class="desc">'+n.desc+'</p><div class="metrics">'+n.metrics.map(m=>'<div class="metric"><small>'+m[0]+'</small><b>'+m[1]+'</b><span class="delta '+(m[2].startsWith('−')?'down':'')+'">'+m[2]+'</span></div>').join('')+'</div><div class="section">CONNECTED AREAS</div><div class="links">'+related+'</div>';document.body.appendChild(el);panelResizeObserver.observe(el);});dock.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id!==undefined&&panelWindows.some(p=>Number(b.dataset.id)===p.id)));}
dock.innerHTML='<button data-home>⌂ Overview</button>'+nodes.map(n=>'<button data-id="'+n.id+'"><i class="dot" style="color:'+n.color+';background:'+n.color+'"></i>'+n.name+'</button>').join('');
dock.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home'))clear();else if(b.dataset.id!==undefined)openPanel(Number(b.dataset.id));});
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const el=b.closest('.panel'),id=el?Number(el.dataset.panel):null;if(id===null)return;focusPanel(id);if(b.hasAttribute('data-close'))closePanel(id);else if(b.hasAttribute('data-home'))clear();else if(b.dataset.select!==undefined)openPanel(Number(b.dataset.select));});
panel.addEventListener('pointerdown',e=>{const head=e.target.closest('[data-drag]'),el=e.target.closest('.panel');if(!head||!el||e.target.closest('button'))return;const id=Number(el.dataset.panel),p=panelFor(id);if(!p)return;focusPanel(id);panelDrag={id,el,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y};el.setPointerCapture?.(e.pointerId);e.preventDefault();});
panel.addEventListener('pointermove',e=>{if(!panelDrag)return;const p=panelFor(panelDrag.id);if(!p)return;p.x=clamp(panelDrag.x+e.clientX-panelDrag.startX,6,window.innerWidth-elWidth(panelDrag.el)-6);p.y=clamp(panelDrag.y+e.clientY-panelDrag.startY,6,window.innerHeight-elHeight(panelDrag.el)-6);panelDrag.el.style.left=p.x+'px';panelDrag.el.style.top=p.y+'px';});
panel.addEventListener('pointerup',e=>{if(e.target.closest('[data-close]')){const el=e.target.closest('.panel'),id=el?Number(el.dataset.panel):null;if(id!==null){e.preventDefault();focusPanel(id);closePanel(id);}}panelDrag=null;});
panel.addEventListener('pointercancel',()=>{panelDrag=null;});
function elWidth(el){return el.getBoundingClientRect().width;}
function elHeight(el){return el.getBoundingClientRect().height;}
function clear(){selected=null;panelWindows=[];document.querySelectorAll('.panel[data-panel]').forEach(el=>el.remove());dock.querySelectorAll('button').forEach(b=>b.classList.remove('active'));}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0};canvas.setPointerCapture(e.pointerId);tip.style.opacity='0';});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);targetYaw-=dx*.005;targetPitch=clamp(targetPitch+dy*.004,-1.15,1.15);drag.x=e.clientX;drag.y=e.clientY;}else{hover=null;let best=Infinity;for(const p of canvas._hits||[]){const d=Math.hypot(e.clientX-p.x,e.clientY-p.y);if(d<p.r&&d<best){best=d;hover=p.id;}}canvas.style.cursor=hover===null?'grab':'pointer';}});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<8){let found=null,best=Infinity;for(const p of canvas._hits||[]){const d=Math.hypot(e.clientX-p.x,e.clientY-p.y);if(d<Math.max(22,p.r)&&d<best){best=d;found=p.id;}}if(found!==null)openPanel(found);}drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();targetZoom=clamp(targetZoom*(e.deltaY>0?.90:1.11),.55,4.0);},{passive:false});
let pinch=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch={distance:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),zoom:targetZoom};}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();const a=e.touches[0],b=e.touches[1],distance=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);targetZoom=clamp(pinch.zoom*(distance/pinch.distance),.55,4.0);}}, {passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape')clear();});
const panelResizeObserver=new ResizeObserver(entries=>{for(const entry of entries){const el=entry.target,p=panelFor(Number(el.dataset.panel));if(p){p.w=entry.contentRect.width;p.h=entry.contentRect.height;}}});window.addEventListener('resize',resize);resize();frame();
})();
</script></body></html>
