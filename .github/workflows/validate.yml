name: Validate Data Center and Universe Core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/multi-tenant-business-core]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        # Use npm install while package-lock is reconciled with package.json.
        run: npm install --no-audit --no-fund
      - name: Run analytics unit tests
        run: npm test
      - name: Build site and API bundle
        run: npm run build
