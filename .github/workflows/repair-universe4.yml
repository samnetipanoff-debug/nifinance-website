name: Debug Universe 4 payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p=Path("public/universe-4-experience.html")
          b=p.read_bytes()
          lines=[f"length={len(b)}",f"first32_hex={b[:32].hex()}"]
          try:
              o=gzip.decompress(b); lines.append(f"raw_gzip=ok:{len(o)}")
          except Exception as e: lines.append(f"raw_gzip=fail:{type(e).__name__}:{e}")
          try:
              c=base64.b64decode(b); o=gzip.decompress(c); lines.append(f"b64_gzip=ok:{len(o)}")
          except Exception as e: lines.append(f"b64_gzip=fail:{type(e).__name__}:{e}")
          Path("u4-debug.txt").write_text("\n".join(lines))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add u4-debug.txt
          git commit -m "Debug Universe 4 payload"
          git push
