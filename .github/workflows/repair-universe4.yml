name: Restore Universe 4 HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        run: |
          cat > public/universe-4-experience.html <<'EOF'
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Business Universe — NIFINANCE</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eaf4e8;font:14px system-ui}#u{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#l{position:fixed;inset:0;pointer-events:none}.n{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:650;text-shadow:0 0 12px #000,0 0 14px currentColor}.n i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;box-shadow:0 0 9px currentColor}.top{position:fixed;top:22px;left:26px;z-index:3}.top b{font-size:11px;letter-spacing:.32em}.top span{display:block;color:#91a58e;font-size:10px;letter-spacing:.18em;margin-top:5px}.status{position:fixed;top:25px;right:26px;z-index:3;color:#8ba18a;font-size:10px;letter-spacing:.2em}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b7f77d;box-shadow:0 0 12px #b7f77d;margin-right:8px}.dock{position:fixed;z-index:4;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:calc(100vw - 20px);overflow:auto;padding:7px;border:1px solid #b1e09722;border-radius:18px;background:#040a06c9;backdrop-filter:blur(18px)}.dock button{white-space:nowrap;color:#a9b9a5;background:none;border:0;padding:8px;font-size:11px}@media(max-width:720px){.top{top:15px;left:16px}.status{top:18px;right:16px}.dock{left:10px;right:10px;transform:none}}
</style></head><body><canvas id="u"></canvas><div id="l"></div><div class="top"><b>BUSINESS UNIVERSE</b><span>NIFINANCE · INTERACTIVE SYSTEM</span></div><div class="status"><i></i>LIVE MODEL</div><nav class="dock" id="d"></nav>
<script type="module">
import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const c=u,s=new T.Scene(),cam=new T.PerspectiveCamera(43,innerWidth/innerHeight,.05,100),r=new T.WebGLRenderer({canvas:c,antialias:true}),U=new T.Group(),L=new T.Group(),N=new T.Group(),O=new T.Group(),R=2.55;
r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setClearColor(0);cam.position.z=8;s.add(U);U.add(L,N,O);s.add(new T.AmbientLight(0xffffff,.8));let pl=new T.PointLight(0xd6ffba,5,15);s.add(pl);
const rows=[['Marketing','#71dfff',8,8],['Sales','#b9a0ff',42,3],['Customers','#f3e66d',80,13],['Production','#ff8c70',128,-5],['Procurement','#ffbf69',174,12],['Logistics','#70d6b2',222,-10],['Finance','#e8f3df',285,30],['Economics','#9dff8c',335,38],['People','#b9a0ff',262,-42],['Data & IT','#71dfff',30,-46]],E=[[0,1],[1,2],[2,0],[1,3],[3,4],[4,5],[3,5],[5,2],[1,6],[6,7],[7,3],[7,1],[8,3],[8,6],[9,0],[9,1],[9,7]];
const ll=(a,b)=>{a=T.MathUtils.degToRad(a);b=T.MathUtils.degToRad(b);return new T.Vector3(Math.cos(b)*Math.sin(a),Math.sin(b),Math.cos(b)*Math.cos(a))},M=(c,o=1)=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthWrite:false,blending:2}),G=(q,c,o)=>new T.Mesh(new T.SphereGeometry(q,16,16),M(c,o)),P=n=>n.v.clone().multiplyScalar(R);
const ns=rows.map((x,i)=>({id:i,name:x[0],color:x[1],v:ll(x[2],x[3])}));U.add(G(.18,0xbaff8b,.95),G(.45,0x9dff8c,.15),G(.8,0x9dff8c,.04));U.add(new T.Mesh(new T.SphereGeometry(R,30,30),new T.MeshBasicMaterial({color:0x9fd39a,wireframe:true,transparent:true,opacity:.035})));
function ring(q,a,b,o){let e=new T.EllipseCurve(0,0,q,q*.42,0,6.283,false,0),g=new T.BufferGeometry().setFromPoints(e.getPoints(100).map(p=>new T.Vector3(p.x,p.y,0))),x=new T.LineLoop(g,new T.LineBasicMaterial({color:0xb6ef9d,transparent:true,opacity:o}));x.rotation.set(a,b,.2);O.add(x)}ring(2.9,.32,.2,.13);ring(3.15,-.68,1.05,.075);ring(2.75,1.02,-.5,.06);
let sp=new Float32Array(3000);for(let i=0;i<1000;i++){let q=15+Math.random()*22,a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);sp[i*3]=q*Math.sin(b)*Math.cos(a);sp[i*3+1]=q*Math.cos(b);sp[i*3+2]=q*Math.sin(b)*Math.sin(a)}let sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(sp,3));s.add(new T.Points(sg,new T.PointsMaterial({color:0xdff6df,size:.045,transparent:true,opacity:.8})));
const no=[];ns.forEach(n=>{let q=new T.Group();q.position.copy(P(n));q.userData.id=n.id;let h=G(.22,n.color,.12),o=new T.Mesh(new T.SphereGeometry(.075,14,14),M(n.color)),z=new T.Mesh(new T.RingGeometry(.11,.125,22),new T.MeshBasicMaterial({color:n.color,transparent:true,opacity:.5,side:2,depthWrite:false,blending:2}));o.userData.id=z.userData.id=n.id;q.add(h,o,z);N.add(q);no.push({n,q,h,o,z})});
const cv=(a,b,i)=>{let x=P(ns[a]),y=P(ns[b]),m=x.clone().add(y).multiplyScalar(.5),q=m.clone().normalize().multiplyScalar(.5+Math.sin(i*2.7)*.12);return new T.CatmullRomCurve3([x,x.clone().lerp(m,.5).add(q),y.clone().lerp(m,.5).add(q),y])},lo=[];E.forEach((e,i)=>{let q=cv(e[0],e[1],i),t=new T.Mesh(new T.TubeGeometry(q,36,.012,5),M(0x9dc99a,.24)),g=new T.Mesh(new T.TubeGeometry(q,28,.035,5),M(0x9dff8c,.035));L.add(t,g);lo.push({a:e[0],b:e[1],q,t,g,p:[G(.045,0xcaffad,.9),G(.045,0xcaffad,.9)]});lo.at(-1).p.forEach(x=>L.add(x))});
ns.forEach(n=>{let e=document.createElement('div');e.className='n';e.dataset.id=n.id;e.style.color=n.color;e.innerHTML='<i style="background:'+n.color+'"></i>'+n.name;l.append(e)});
let ray=new T.Raycaster(),pt=new T.Vector2(),drag=null,pinch=null,zt=8,zc=8,sel=null,clock=new T.Clock();
function hit(e){let q=c.getBoundingClientRect();pt.x=(e.clientX-q.left)/q.width*2-1;pt.y=-(e.clientY-q.top)/q.height*2+1;ray.setFromCamera(pt,cam);let h=ray.intersectObjects(no.flatMap(x=>[x.o,x.z]),true);return h.length?h[0].object.userData.id:null}
function hi(){no.forEach(o=>{let a=sel===o.n.id,r=sel!==null&&E.some(e=>(e[0]===sel&&e[1]===o.n.id)||(e[1]===sel&&e[0]===o.n.id));o.h.material.opacity=a?.28:r?.14:.07;o.z.material.opacity=a?.95:r?.55:.4});lo.forEach(o=>{let a=sel!==null&&(o.a===sel||o.b===sel);o.t.material.opacity=a?.78:.24;o.g.material.opacity=a?.13:.035})}
c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:0,rx:U.rotation.x,ry:U.rotation.y};c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(drag){let x=e.clientX-drag.x,y=e.clientY-drag.y;drag.m+=Math.abs(x)+Math.abs(y);U.rotation.y=drag.ry+x*.004;U.rotation.x=Math.max(-1.2,Math.min(1.2,drag.rx+y*.004))}};c.onpointerup=e=>{if(drag&&drag.m<7){let id=hit(e);if(id!==null){sel=id;hi()}}drag=null};c.onwheel=e=>{e.preventDefault();zt=Math.max(3,Math.min(13,zt+(e.deltaY>0?.4:-.4)))};
function resize(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}onresize=resize;resize();
function loop(){requestAnimationFrame(loop);let d=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;zc+=(zt-zc)*(1-Math.exp(-d*5));cam.position.z=zc;if(!drag)U.rotation.y+=d*.045;O.rotation.y=t*.035;lo.forEach(o=>o.p.forEach((p,k)=>p.position.copy(o.q.getPointAt((t*.055+k*.5)%1))));U.updateMatrixWorld(true);no.forEach(o=>{let v=o.q.getWorldPosition(new T.Vector3()).project(cam),e=l.querySelector('[data-id="'+o.n.id+'"]');e.style.left=((v.x*.5+.5)*innerWidth)+'px';e.style.top=((-v.y*.5+.5)*innerHeight-18)+'px';e.style.opacity=v.z<1&&v.z>-1?.9:.04});r.render(s,cam)}hi();loop();
</script></body></html>
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
