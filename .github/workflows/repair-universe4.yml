name: Restore Universe 4 HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          b64=""""""
          Path("public/universe-4-experience.html").write_bytes(gzip.decompress(base64.b64decode(b64)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/universe-4-experience.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Universe 4 3D implementation"
          git push
