name: Repair Universe 4 HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore HTML payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p = Path("public/universe-4-experience.html")
          b = p.read_bytes()
          out = None
          for candidate in (b, base64.b64decode(b) if all(c in b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n\r" for c in b[:200]) else b):
              try:
                  out = gzip.decompress(candidate)
                  break
              except Exception:
                  pass
          if out is None:
              print("Universe 4 is already plain HTML")
              raise SystemExit(0)
          p.write_bytes(out)
          PY
          if git diff --quiet -- public/universe-4-experience.html; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/universe-4-experience.html
          git commit -m "Restore Universe 4 HTML payload"
          git push
